# Добавить внутри server для m21.system404-design.ru; путь к PHP-FPM зависит от хостинга.
index index.php;
location ~ ^/(lib|database|tools|storage|data|vendor)/ { deny all; }
location ~ ^/config(?:\.[a-zA-Z0-9_-]+)+\.php$ { deny all; }
location ~ \.(sql|md|log|json)$ { deny all; }
location / { try_files $uri $uri/ /index.php?$query_string; }
location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
# Fingerprinted bundle files are immutable; HTML/API set no-store in PHP.
location ~ ^/assets/runtime/(app\.[a-f0-9]{16}\.js|ui\.[a-f0-9]{16}\.css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ~ ^/assets/(js|css)/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
}

client_max_body_size 16m;
