# Добавить внутри server для m21.system404-design.ru; путь к PHP-FPM зависит от хостинга.
index index.php;
location ~ ^/(lib|database|tools|storage)/ { deny all; }
location ~ ^/config\.(local|example)\.php$ { deny all; }
location ~ \.(sql|md|log|json)$ { deny all; }
location / { try_files $uri $uri/ /index.php?$query_string; }
location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
