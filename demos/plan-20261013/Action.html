    return `<aside class="decision-panel shop-panel">${title}<p>${ops.length} технологических операций${state.mode === 'flow' && !unassigned ? `<br>Интервал группы: ${n(result.cycle == null ? null : result.load[focus])} с/изд.<br>Требуемый такт: ${n(result.requiredTakt)} с/изд.` : ''}</p>${focus === result.rhythmConstraint ? '<p class="attention">Наибольшая нагрузка группы. Сравните варианты, чтобы проверить влияние на полный срок.</p>' : ''}${focus === 'holes' ? '<p>Общий ресурс: бронь другого заказа на 12–13 октября.</p>' : ''}${!unassigned ? btn('Посмотреть варианты', 'scenarios', '', 'secondary') : '<p>Назначьте операции на совместимые физические места. Выбранный способ организации сохранится.</p>'}${opRows(ops, editable)}${editable ? `<label>Совместимое место<select id="destination"><option value="">Выберите место</option>${state.raw.blocks.filter(b => selected.size && [...selected].every(id => M.compatible(state.raw.ops.find(o => o.id === id), b))).map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label><div class="panel-actions">${btn('Перенести выбранные', 'move')}${!unassigned ? btn('Снять выбранные с места', 'unassign') : ''}${ops.length && state.mode === 'flow' ? `<button class="block-drag" draggable="true" data-drag-block="${ops.map(o => o.id).join(',')}">⠿ Перетащить весь блок</button>` : ''}</div>` : `<a href="${href('technology/' + focus)}">Открыть операции узла ↗</a><p>Распределение между физическими местами доступно на карте потока.</p>`}</aside>`;
  }
  function scenarioSheet() { if (!scenarios) return ''; return `<div class="scenario-sheet"><div class="panel-title"><h2>Варианты для текущей организации</h2>${btn('×', 'scenarios', '', 'panel-close')}</div><small>Сейчас ${day(result.finish)} · ${n(result.scope)} изделий в расчёте</small><div class="scenario-options">${D.variants(state).map(v => `<article class="${preview === v.id ? 'selected' : ''}"><h3>${v.title}</h3><p>${v.reason}</p><strong>${day(v.result.finish)}</strong><small>${n(v.result.scope)} изделий · WIP до ${v.result.maxWip}${state.mode === 'flow' ? ' · интервал ' + n(v.result.cycle) + ' с/изд.' : ''}</small>${preview === v.id ? `<p>Трудоёмкость ${n(v.result.labor == null ? null : v.result.labor / 3600)} ч. Дополнительные люди и машины не добавляются. Меняется будущая работа; факт сохраняется.</p>${btn('Применить в черновик', 'apply', v.id, 'primary')}` : btn('Сравнить последствия', 'preview', v.id, 'secondary')}</article>`).join('')}</div></div>`; }
  function shop(action = false) {
    return focusTitle(action ? 'Действие · тот же цех' : 'Цех', `${D.modes[state.mode]} · ${action ? 'снимок подтверждённой версии ' + record.active?.number : 'выберите место, чтобы раскрыть работу'}`, action ? '' : btn('Не распределено · ' + result.unassigned.length, 'unassigned')) + `<div class="shop-workspace ${focus ? 'has-panel' : ''}"><div class="shop-map-area">${map(state.mode, action)}${!action ? scenarioSheet() : ''}</div>${focusPanel()}</div>${action ? `<div class="execution-layer"><span>${n(record.draft.raw.accepted)} принято · WIP ${record.draft.raw.cohorts.reduce((s, c) => s + c.qty, 0)} · ${record.events.length} новых учебных событий</span>${record.events.length ? '<b>Учебный эпизод завершён · принято 10</b>' : !record.assigned ? btn('Назначить Ирину и Ольгу на эпизод исправления', 'assign', '', 'secondary') : btn('Смоделировать приёмку 10 после исправления', 'fact', '', 'secondary')}</div><p class="scope-note">Люди и события вымышлены. Карта сохраняет подтверждённую организацию; новый факт пересчитывает только будущий черновик.</p>` : `<div class="shop-footer"><span>${state.mode === 'flow' ? `Требуемый такт ${n(result.requiredTakt)} с/изд. · текущий интервал ${n(result.cycle)} с/изд.` : state.mode === 'nodes' ? 'Параллельные ветви сходятся по зависимостям' : '12 комплексных единиц используют общие специальные ресурсы'}</span>${btn('Посмотреть варианты', 'scenarios')}<a href="${href('organization')}">Изменить организацию ↗</a></div>`}${summary()}`;
  }
  function technology(node) {
    const chosen = state.raw.nodes.find(n => n.id === node), op = state.raw.ops.find(o => o.id === operationId);
    return focusTitle('Технология', 'J-02 · изделие → узел → операция. Плановое время — учебная оценка.') + `<div class="technology-focus ${op ? 'has-detail' : ''}"><div>${chosen ? `<a class="text-button" href="${href('technology')}">← Всё изделие</a><h2 class="node-heading">${chosen.name}</h2><div class="tech-operations">${state.raw.ops.filter(o => o.node === node).map(o => `<button data-act="operation" data-value="${o.id}"><span>${esc(o.name)}</span><b>${o.time.planning == null ? 'Не определено' : n(o.time.planning) + ' с'}</b><i>↗</i></button>`).join('')}</div>` : `<div class="product-heading"><h2>Жакет с подкладкой</h2><p>Две листочки · воротник · два рукава · две пуговицы</p></div><div class="technology-nodes">${state.raw.nodes.map(n => `<a href="${href('technology/' + n.id)}"><small>${state.raw.ops.filter(o => o.node === n.id).length} операций</small><h2>${n.name}</h2><p>${n.output}</p><span>Открыть узел ↗</span></a>`).join('')}</div>`}</div>${op ? `<aside class="decision-panel"><div class="panel-title"><h2>${esc(op.name)}</h2>${btn('×', 'operation', '', 'panel-close')}</div><p>${esc(op.method)}</p><dl><dt>Вход</dt><dd>${esc(op.input)}</dd><dt>Результат</dt><dd>${esc(op.output)}</dd><dt>Место</dt><dd>${esc(state.raw.blocks.find(b => b.id === op.block)?.name || 'Не назначено')}</dd><dt>Контроль</dt><dd>${esc(op.check)}</dd><dt>Передача</dt><dd>Совместимая пачка · до ${state.raw.organization.transfer} изделий</dd></dl>${['spread', 'cut', 'kit'].includes(op.id) ? '<p>Подготовка комплектного кроя рассчитывается по настилам: 600 с на настил + 30 с на слой + 80 с на комплект. Пооперационные значения ниже — справочные и не используются второй раз в прогнозе.</p><a href="' + href('cut') + '">Открыть план настилов ↗</a>' : `<label>Плановое время, с/изделие<input id="op-time" type="number" min="1" max="86400" value="${op.time.planning ?? ''}" placeholder="Не определено"></label>`}<details><summary>Источник и другие виды времени</summary><p>${esc(op.time.source.label)}. Применимость: J-02, выбранный метод и оборудование. История: версия операции ${op.version}.</p><p>Наблюдаемое — нет измерений.<br>Нормативное — не утверждено.<br>Фактическое — нет замеров.</p></details></aside>` : ''}</div>${summary()}`;
  }
  function overview(ordersOnly) { return `<div class="overview-heading"><span class="eyebrow">${execution ? "Действие" : "План"} · всё производство</span><h1>${ordersOnly ? 'Заказы и их исполнимость' : 'У каждого заказа — свой путь'}</h1><p>Одна подробная модель жакета. Для остальных заказов технология ещё не подготовлена.</p></div><div class="overview-orders">${TargetModel.orders.map(o => `<a href="#/order/${o.id}"><small>К ${day(o.deadline)}</small><i></i><h2>${o.name}</h2><p>${n(o.qty)} шт.</p><span>${o.id === 'jacket' ? (execution ? record.active ? 'Открыть подтверждённый план ' + record.active.number : 'Сначала нужен подтверждённый план' : 'Крой · организация · цех') : 'Нужно подготовить модель'}</span></a>`).join('')}</div>${!ordersOnly ? '<a class="primary" href="#/orders">Все планируемые заказы →</a>' : ''}<p class="scope-note">Общая исполнимость не подтверждена. Часть занятости общих ресурсов ещё неизвестна.</p>`; }
  function dialog(title, html) { document.querySelector('dialog')?.remove(); const el = document.createElement('dialog'); el.className = 'decision-dialog'; el.innerHTML = `<form method="dialog"><button class="panel-close" aria-label="Закрыть">×</button></form><h2>${title}</h2>${html}<p class="dialog-error" role="alert"></p>`; document.body.append(el); el.showModal(); }
  function render() {
    record = S.read(); state = execution && record.active ? record.active.state : record.draft; result = D.calculate(state); lastStored = JSON.stringify(record);
    if (pointerEdit) { pendingRender = true; return; }
    const r = route(), deep = !!r.part || (execution && !!r.id);
    document.body.dataset.depth = deep ? 'focus' : r.id ? 'decision' : 'overview';
    let content;
    if (!r.id) content = overview(r.view === 'orders');
    else if (r.id !== 'jacket') content = `<div class="overview-heading"><a href="#/orders">← Заказы</a><h1>${esc(TargetModel.orders.find(o => o.id === r.id)?.name || 'Заказ не найден')}</h1><p>Для этого заказа технология и производственный план ещё не подготовлены.</p></div>`;
    else if (execution) content = record.active ? shop(true) : focusTitle('Сначала нужен подтверждённый план', 'Черновик не становится производственным заданием автоматически.') + `<a class="primary" href="${links('plan')}${href('')}">Открыть План жакета →</a>`;
    else content = ({ cut: cutView, organization, shop, technology: () => technology(r.node) }[r.part] || main)();
    app.innerHTML = shell(r.id, deep) + `<main class="decision-workspace ${deep ? 'focus-workspace' : ''}">${content}</main>`;
  }
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) { finishPointerEdit(); return; }
    pointerEdit = false;
    const action = el.dataset.act, value = el.dataset.value;
    try {
      if (action === 'color') { color = value; layId = null; render(); }
      if (action === 'lay') { layId = value; render(); }
      if (action === 'auto') change(s => { s.lays = D.autoLays(s); }, 'Настилы предложены по потребности');
      if (action === 'split') change(s => D.split(s, value), 'Настил разделён');
      if (action === 'merge') change(s => D.merge(s, value), 'Настилы объединены');
      if (action === 'mode') change(s => { s.mode = value; }, 'Выбрано: ' + D.modes[value]);
      if (action === 'focus') { focus = value || null; selected.clear(); render(); }
      if (action === 'unassigned') { focus = 'unassigned'; selected.clear(); render(); }
      if (action === 'undo') { if (!record.undo.length) throw Error('В этом черновике пока нет изменений для отмены'); S.undo(); render(); message('Предыдущее состояние восстановлено. Факт и действующий план сохранены.'); }
      if (action === 'scenarios') { scenarios = !scenarios; preview = null; render(); }
      if (action === 'preview') { preview = value; render(); }
      if (action === 'apply') { const v = D.variants(state).find(v => v.id === value); change(s => Object.assign(s, v.state), 'Сценарий применён в черновик'); scenarios = false; preview = null; render(); }
      if (action === 'move') { if (!selected.size) throw Error('Сначала выберите операции'); const target = document.querySelector('#destination').value; if (!target) throw Error('Выберите совместимое место'); change(s => M.move(s.raw, [...selected], target), 'Работа перенесена'); selected.clear(); render(); }
      if (action === 'unassign') { if (!selected.size) throw Error('Выберите операции'); change(s => s.raw.ops.filter(o => selected.has(o.id)).forEach(o => { o.block = ''; }), 'Работа возвращена в нераспределённую'); selected.clear(); render(); }
      if (action === 'operation') { operationId = value || null; render(); }
      if (action === 'confirm-review') { reviewed = JSON.stringify(S.read().draft); dialog('Передача плана в Действие', `<p>${n(result.scope)} изделий в области плана. ${result.blocked ? n(result.blocked) + ' остаются вне области.' : 'Остаток заказа включён целиком.'}</p><p>Прогноз ${day(result.finish || result.last)}. ${esc(caption())}.</p><p>Версия действует только для ещё не выполненной работы после учебного среза 12 октября, ${state.raw.calendar.notBefore ? '10:30' : '09:00'}. Нормы, квалификации и длительности вымышлены.</p>${result.errors.length ? `<p class="attention">${esc(result.errors.join('; '))}</p>` : ''}<label class="checkline"><input id="ack" type="checkbox">Понимаю область, отклонение от срока и учебные условия.</label>${btn('Подтвердить учебный план', 'confirm', '', 'primary')}`); }
      if (action === 'confirm') { S.confirm(document.querySelector('#ack').checked, reviewed); document.querySelector('dialog').close(); render(); dialog('План передан', `<p>Подтверждённая карта сохранена. Конкретных людей назначает бригадир в ДЕЙСТВИИ.</p><a class="primary" href="${links('action')}${href('')}">Перейти в Действие →</a>`); }
      if (action === 'history') dialog('Черновик и действующие версии', `<p>Черновик v${state.revision}. Изменения не применяются к действующей версии автоматически.</p>${record.versions.map(v => `<p>План ${v.number} · ${D.modes[v.state.mode]} · ${n(v.scope)} изделий · ${day(v.forecast || v.partial)}</p>`).join('') || '<p>Действующих версий пока нет.</p>'}`);
      if (action === 'assign') { S.assign(); render(); message('Вымышленные Ирина и Ольга назначены на исправление и приёмку.'); }
      if (action === 'fact') { S.fact(); render(); message('10 изделий приняты. Будущий черновик обновлён, карта действующего плана сохранена.'); }
    } catch (error) { const el = document.querySelector('dialog[open] .dialog-error'); if (el) el.textContent = error.message; else message(error.message); } finally { finishPointerEdit(); }
  });
  document.addEventListener('change', e => {
    try {
      if (e.target.id === 'layers') { const value = Number(e.target.value); change(s => { s.lays.find(l => l.id === layId).layers = value; }, 'Слои изменены'); }
      if (e.target.id === 'marker') { const value = e.target.value; change(s => { s.lays.find(l => l.id === layId).marker = value; }, 'Размерное сочетание изменено'); }
      if (e.target.id === 'material-available') { const value = e.target.checked; change(s => { s.colors.find(c => c.id === color).available = value; }, 'Доступность партии изменена'); }
      if (e.target.matches('[data-select]')) { e.target.checked ? selected.add(e.target.dataset.select) : selected.delete(e.target.dataset.select); render(); }
      if (e.target.id === 'op-time') { const value = e.target.value === '' ? null : Number(e.target.value); if (value !== null && (!Number.isFinite(value) || value <= 0 || value > 86400)) throw Error('Укажите положительное время до 86 400 секунд или оставьте неизвестным'); change(s => { const op = s.raw.ops.find(o => o.id === operationId); op.time.planning = value; op.version++; op.time.source.label = 'Ручная учебная оценка'; }, 'Плановое время изменено'); }
    } catch (error) { message(error.message); render(); }
  });
  document.addEventListener('dragstart', e => { const el = e.target.closest('[data-drag],[data-drag-block]'); if (!el) return; const ids = el.dataset.dragBlock ? el.dataset.dragBlock.split(',') : selected.has(el.dataset.drag) ? [...selected] : [el.dataset.drag]; e.dataTransfer.setData('text/plain', JSON.stringify(ids)); e.dataTransfer.effectAllowed = 'move'; document.querySelectorAll('[data-drop]').forEach(t => t.classList.toggle('drop-ok', ids.every(id => M.compatible(state.raw.ops.find(o => o.id === id), state.raw.blocks.find(b => b.id === t.dataset.drop))))); });
  document.addEventListener('dragover', e => { if (e.target.closest('[data-drop]')) e.preventDefault(); });
  document.addEventListener('drop', e => { const el = e.target.closest('[data-drop]'); if (!el) return; e.preventDefault(); try { const ids = JSON.parse(e.dataTransfer.getData('text/plain')); if (!Array.isArray(ids)) return; change(s => M.move(s.raw, ids, el.dataset.drop), 'Блок работ перенесён'); } catch (error) { message(error.message); } });
  document.addEventListener('dragend', () => document.querySelectorAll('.drop-ok').forEach(el => el.classList.remove('drop-ok')));
  addEventListener('hashchange', () => { document.querySelector('dialog')?.remove(); reviewed = null; focus = null; selected.clear(); scenarios = false; operationId = null; render(); window.scrollTo(0, 0); });
  if (!location.hash) { const order = new URLSearchParams(location.search).get('order'); history.replaceState(null, '', order ? '#/order/' + encodeURIComponent(order) : '#/overview'); }
  function sync() {
    if (pointerEdit || document.activeElement?.matches('input, select')) return;
    if (JSON.stringify(S.read()) === lastStored) return;
    document.querySelector('dialog')?.remove(); reviewed = null; selected.clear(); render();
    message('Данные обновлены из другой вкладки. Действующая версия и черновик показаны отдельно.');
  }
  addEventListener('storage', e => { if (e.key === S.KEY) sync(); });
  addEventListener('pageshow', sync);
  addEventListener('focus', sync);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
  // file:// storage events differ by browser; also compare the small saved record.
  setInterval(sync, 1500);
  render();
})();
</script></body></html>
