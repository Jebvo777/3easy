    if(step===3) body=`<h1>Что потребуется для заказа?</h1><p class="lead">Добавьте известные материалы и прямые расходы. Остальное можно уточнить позже.</p><div>${editing.materials.map((m,i)=>`<div class="material"><span>${esc(m.name)}<small>${esc(m.kind)} · ${m.payer==='company'?'расход производства':'оплачивает заказчик'} · ${m.qty===null?'количество неизвестно':n(m.qty)+' '+esc(m.unit)} · ${m.amount===null?'сумма неизвестна':rub(m.amount)}</small></span><button data-remove="${i}" aria-label="Удалить ${esc(m.name)}">×</button></div>`).join('')}</div>${materialOpen?`<div class="inline-editor"><h3>Материал или расход</h3><div class="form-grid"><label>Название<input id="mat-name" placeholder="Например, костюмная ткань" maxlength="160"></label><label>Источник<select id="mat-kind"><option>Материалы производства</option><option>Материалы заказчика</option><option>Закупка под заказ</option><option>Прямой расход / услуга</option></select></label><label>Кто несёт расход<select id="mat-payer"><option value="company">Производство</option><option value="customer">Заказчик</option></select></label><label>Сумма целиком, ₽<input id="mat-amount" inputmode="decimal" placeholder="Можно оставить пустым"></label><label>Количество<input id="mat-qty" inputmode="decimal" placeholder="Можно уточнить позже"></label><label>Единица<input id="mat-unit" placeholder="кг, м, шт." maxlength="30"></label></div>${btn('+ Добавить','addMaterial','secondary')}</div>`:btn('+ Добавить ещё','showMaterial','secondary')}<p class="help">Материал заказчика не превращается в наш расход. Закупку под заказ можно указать напрямую, без заведения складского остатка.</p>`;
    if(step===4) body=`<h1>К какому сроку?</h1><p class="lead">Это желаемый срок. Выполнимость проверяется по технологии, людям и календарю.</p><div class="form-grid">${input('Срок завершения','deadline','date')}</div><div class="review"><strong>${esc(editing.name||'Заказ без названия')}</strong><br>${editing.type==='own'?'Собственная продукция':'Подряд'} · ${editing.qty?`${n(editing.qty)} ${esc(editing.unit)}`:'Объём не задан'}<br>${editing.type==='own'?'Предел себестоимости: ':'Цена подряда: '}${rub(editing.type==='own'?editing.target:editing.price)}${editing.type==='contract'?(editing.priceBasis==='unit'?' за единицу':' за весь заказ'): ' за единицу'}<br>${editing.materials.length} позиций материалов и расходов</div><p class="help">Сохраним черновик. Он появится среди заказов, но не изменит общую экономику до проверки плана.</p>`;
    return `<section class="screen create"><nav class="steps" aria-label="Шаги создания">${labels.map((s,i)=>`<button data-step="${i}" class="${i===step?'active':i<step?'passed':''}" aria-label="${i+1}. ${s}" ${i===step?'aria-current="step"':''}></button>`).join('')}</nav><div class="eyebrow">${step+1} / 5 · ${labels[step]}</div>${body}<div class="error" role="alert" id="form-error"></div><div class="form-actions">${step>0?btn('← Назад','previous',''):btn('Отмена','cancel','')}<div class="right">${step<4?btn('Сохранить черновик','save','quiet-button'):''}${btn(step===4?'Сохранить заказ':'Далее →',step===4?'save':'next','primary')}</div></div></section>`;
  }
  function render() {
    closeDrawer();
    const parts=route(), view=parts[0]==='orders'?'orders':parts[0]==='order'?'detail':parts[0]==='create'?'create':'economy';
    document.body.dataset.depth=view;
    app.innerHTML=header()+`<main class="workspace">${toolbar(view,currentOrder())}${view==='economy'?economy():view==='orders'?orders():view==='detail'?detail(currentOrder()):create()}</main><footer class="foot"><span>EASY3 · ${view==='create'?'Новый заказ':'Форма · 9 октября 2026'}</span>${btn('Демонстрационные данные · об источниках','about','')}</footer>`;
    if(view==='create' && step===3 && materialOpen) Object.entries(pendingMaterial).forEach(([key,value])=>{const el=document.getElementById('mat-'+key);if(el)el.value=value;});
    document.title='EASY3 · '+(view==='economy'?'Цель':view==='orders'?'Заказы':view==='create'?'Новый заказ':currentOrder()?.name||'Заказ');
  }
  function error(t){ const el=document.querySelector('#form-error'); if(el) el.textContent=t; else toast(t); return false; }
  function validate() {
    if(!editing) return true;
    for(const key of ['qty','target','price']) if (editing[key]!==null && (!Number.isFinite(editing[key]) || editing[key]<0 || (key==='qty'&&editing[key]===0))) return error(key==='qty'?'Количество должно быть больше нуля.':'Укажите число не меньше нуля или оставьте поле пустым.');
    return true;
  }
  function saveDraft(go=true) {
    if(!editing||!validate()||!commitMaterial()) return false;
    const copy=structuredClone(editing); copy.versions=[...(copy.versions||[]),{label:'Сохранение черновика',savedAt:new Date().toISOString(),type:copy.type,name:copy.name,qty:copy.qty,price:copy.price,target:copy.target,priceBasis:copy.priceBasis,deadline:copy.deadline,materials:structuredClone(copy.materials)}];
    const next=drafts.filter(d=>d.id!==copy.id).concat(copy);
    try {localStorage.setItem(STORE,JSON.stringify(next));} catch(_) {return error('Не удалось сохранить в браузере. Проверьте доступ к локальному хранилищу.');}
    drafts=next; editing=copy; dirty=false; toast('Черновик сохранён'); if(go) navigateNow('order/'+copy.id); return true;
  }
  function commitMaterial(force=false) {
    const m=pendingMaterial;
    if(!force && ![m.name,m.qty,m.unit,m.amount].some(v=>v.trim())) return true;
    const qty=M.parseNumber(m.qty),amount=M.parseNumber(m.amount);
    if(!m.name.trim()) return error('Укажите название материала или расхода.');
    if(Number.isNaN(qty)||Number.isNaN(amount)||qty===0) return error('Проверьте количество и сумму. Неизвестные значения оставьте пустыми.');
    editing.materials.push({...m,name:m.name.trim(),qty,amount});
    pendingMaterial=emptyMaterial();materialOpen=false;dirty=true;return true;
  }
  function addMaterial() { if(commitMaterial(true))render(); }
  function closeDrawer(){document.querySelector('.drawer-backdrop')?.remove();app.inert=false;document.body.style.overflow='';if(drawerFocus?.isConnected)drawerFocus.focus();drawerFocus=null;}
  function openDrawer(title, content) {
    closeDrawer(); drawerFocus=document.activeElement;
    const back=document.createElement('div');back.className='drawer-backdrop';back.innerHTML=`<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><button class="close" aria-label="Закрыть">×</button><div class="eyebrow">Цель · подробнее</div><h2 id="drawer-title">${title}</h2>${content}</aside>`;
    document.body.append(back);app.inert=true;document.body.style.overflow='hidden';back.querySelector('.close').focus();back.addEventListener('click',e=>{if(e.target===back||e.target.closest('.close'))closeDrawer();});
    back.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='Tab'){const a=[...back.querySelectorAll('button,a,input,select')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus();}}});
  }
  function explain(action) {
    const p=M.period(period),o=currentOrder(),e=o?M.economics(o):null;
    if(action==='about') return openDrawer('Как устроен этот пример','<p>Это интерактивный визуальный прототип. Компания, заказы, факты и прогнозы вымышлены. Дата примера — 9 октября 2026 года.</p><p>Четыре заказа связаны с экономикой октября. День и неделя показывают отдельные иллюстративные срезы. Линия между фактом и прогнозом — схема перехода, а не временной ряд.</p><p>Черновики сохраняются только в этом браузере. Работающего AI, расчётного движка, сервера и защиты доступа здесь нет. Переключение роли показывает будущие границы интерфейса.</p>');
    if(action==='basis') return openDrawer('Что означает результат',list([['Доходы на сегодня',rub(p.nowIncome)],['Расходы на сегодня',rub(p.nowCost)],['Ожидаемые доходы',rub(p.income)],['Все расходы периода',rub(p.cost)],['Покрытие расходов',rub(p.forecast)]])+'<p>Это управленческая картина покрытия расходов, а не остаток денег на счёте. Доходы факта заданы по принятым этапам, а не как готовые штуки × цена.</p><p>В октябре учтены доходы трёх подрядных заказов и расходы всех четырёх. Будущие продажи собственной продукции неизвестны; итоговую прибыль предприятия по этим данным определить нельзя.</p><p>Плановые и фактические расходы за период не складываются: прогноз включает уже понесённые расходы и ожидаемый остаток.</p>');
    if(action==='expenses') return openDrawer('Расходы периода',list([['Понесено к 9 октября',rub(p.nowCost)],['Ожидается всего',rub(p.cost)]])+(role==='owner'?list([['Постоянные',rub(p.fixed)],['Переменные',rub(p.variable)]])+'<p>В затратах заказов эти суммы уже учтены: повторно к заказам их не добавляем.</p>':'<p>Начальнику производства доступна совокупная сумма. Исходные статьи расходов и условия оплаты доступны собственнику.</p>')+'<p>Расходы продолжаются и в простой. Способ распределения между заказами требует отдельного согласования; этот прототип показывает подготовленные итоговые суммы.</p>');
    if(action==='load') return openDrawer('Загрузка по времени',list([['Доступно',n(p.hours)+' ч'],['Занято планом',n(p.usedHours)+' ч'],['Доля загрузки',p.load+'%']])+'<p>Часы берутся из календарей доступных людей и рабочих мест. Средняя загрузка не гарантирует выполнимость: на конкретном участке может быть очередь.</p><p>В примере сборка задерживает жакет, даже при наличии свободного времени на других участках.</p>'+btn('Посмотреть заказ ↗','openBrackets','primary'));
    if(action==='deviation') return openDrawer('Почему прогноз изменился',list([['Исходное ожидание',rub(p.baseline)],['Текущий прогноз',rub(p.forecast)],['Изменение',rub(p.delta)]])+(period==='month'?'<p>Влияние четырёх заказов на общий результат октября:</p>'+list(M.orders.map(x=>[esc(x.name),rub(-x.extra)]))+'<p>У жакета основной сигнал — сдвиг срока. Экономический эффект показан подготовленным прогнозом, а не выведен автоматически из ожиданий между пачками.</p>'+btn('Открыть жакет ↗','openBrackets','primary'):'<p>Это отдельный демонстрационный срез. Детальное распределение отклонения по заказам подготовлено для месяца.</p>'+btn('Показать месяц','month','primary')));
    if(action==='plan') { const destination=o?.id;location.href=(location.protocol==='file:'?'Plan.html':'Plan.html')+(destination?'?order='+encodeURIComponent(destination)+'#/order/'+encodeURIComponent(destination):'#/overview');return; }
    if(action==='action'){location.href=(location.protocol==='file:'?'Action.html':'Action.html')+(o?'?order='+encodeURIComponent(o.id):'');return;}
    if(!o) return;
    if(action==='draftInfo') return openDrawer('Введённые данные',list([['Тип',o.type==='own'?'Собственная продукция':'Подряд'],['Заказчик',esc(o.client||'Не указан')],['Описание',esc(o.description||'Не указано')],['Материалов и расходов',o.materials.length],['Сохранений',o.versions.length]])+o.materials.map(m=>`<p>${esc(m.name)} · ${m.payer==='company'?'расход производства':'расход заказчика'} · ${rub(m.amount)}</p>`).join(''));
    if(action==='reason') return openDrawer(o.note,`<p>${role==='owner'||o.id==='jacket'||o.type==='own'?o.cause:'Текущий прогноз затрат выше исходного расчёта. Подробные статьи доступны собственнику.'}</p>`+list([['Исходное завершение',date(o.deadline)],['Ожидаемое завершение',date(o.forecastDate)],['Изменение затрат',rub(o.extra)]])+btn('Связь с планом ↗','plan','primary'));
    if(action==='history') return openDrawer('Условия и изменения',list([['Количество',n(o.qty)+' '+o.unit],[o.type==='own'?'Предел себестоимости':'Цена подряда',rub(o.type==='own'?o.target:o.price)+(o.type==='own'||o.priceBasis==='unit'?' / шт.':' за заказ')],['Исходный срок',date(o.deadline)]])+o.versions.map(v=>`<h3>${v.label}</h3>${list([['Завершение',date(v.date)],['Расходы на заказ',rub(v.cost)]])}`).join('')+'<p>Исходные условия сохранены. Прогноз меняется отдельно от цели. Завершённые факты не переписываются.</p>');
    if(action==='facts') return openDrawer('Что уже произошло',list([['Готовая продукция',n(o.done)+' '+o.unit],['Незавершённое производство',n(o.wip)+' '+o.unit],['Выявлено дефектов',n(o.reject)+' '+o.unit],['Простой',n(o.downtime)+' ч'],['Понесённые затраты',rub(o.actualCost)]])+'<p>Обновлено 9 октября. Выпуск, незавершённая работа и дефекты — разные показатели; их нельзя безусловно складывать. В рабочей системе факты поступят из «Действия».</p>');
    if(action==='orderBasis') return openDrawer('Основание расчёта',list([['Понесённые затраты',rub(o.actualCost)],['Ожидаемые затраты целиком',rub(e.cost)],['На единицу заказанного объёма',rub(e.unitCost)]])+(role==='owner'?`<p>Материалы: ${esc(o.materials)}. В прогноз уже включена доля общих расходов производства.</p>`:'<p>Детализация материалов, исходных расходов и оплаты скрыта для этой роли.</p>')+(o.planProjection?.schema!==2&&o.planProjection&&role==='owner'?'<p>Для связи с Планом используется демонстрационное правило: изменение труда × 0,12 ₽/с плюс изменение длительности × 18 000 ₽/смену распределяемых расходов. Это допущение примера, не согласованный метод учёта. Перераспределение общих расходов между заказами в рабочем продукте требует отдельного правила.</p>':'')+(o.planProjection?.schema===2?'<p>Новый ПЛАН передаёт область расчёта и остаток труда по операциям. Экономика не пересчитывается без согласованных ставок. Частичный план не заменяет дату всего заказа.</p>':'')+'<p>Прогноз на единицу = ожидаемые затраты заказа / заказанный объём. Это ещё не окончательная себестоимость годной продукции.</p><p>После завершения потребуется фактический годный выпуск и закрытые затраты. Неизвестные затраты нельзя считать нулевыми.</p>');
  }
  document.addEventListener('click', ev=>{
    const t=ev.target.closest('button,a'); if(!t)return;
    if(t.matches('a.brand')&&dirty){ev.preventDefault();return askLeave(()=>location.assign(t.href));}
    if(t.dataset.nav)return navigate(t.dataset.nav);
    if(t.dataset.period){period=t.dataset.period;return render();}
    if(t.dataset.type){editing.type=t.dataset.type;dirty=true;return render();}
    if(t.dataset.step!==undefined){if(validate()&&commitMaterial()){step=Number(t.dataset.step);render();}return;}
    if(t.dataset.remove!==undefined){editing.materials.splice(Number(t.dataset.remove),1);dirty=true;return render();}
    const a=t.dataset.action;if(!a)return;
    if((a==='plan'||a==='action')&&dirty)return askLeave(()=>explain(a));
    if(a==='create'){if(dirty)return;editing=newDraft();pendingMaterial=emptyMaterial();materialOpen=true;step=0;return navigate('create');}
    if(a==='edit'){editing=structuredClone(currentOrder());pendingMaterial=emptyMaterial();materialOpen=!editing.materials.length;step=0;return navigate('create/'+editing.id);}
    if(a==='orders'||a==='cancel')return navigate('orders');
    if(a==='next'||a==='previous'){if(validate()&&commitMaterial()){step+=a==='next'?1:-1;render();}return;}
    if(a==='save')return saveDraft();
    if(a==='showMaterial'){materialOpen=true;return render();}
    if(a==='addMaterial')return addMaterial();
    if(a==='openBrackets')return navigate('order/jacket');
    if(a==='month'){period='month';return navigate('economy');}
    explain(a);
  });
  document.addEventListener('input',ev=>{
    const el=ev.target;
    const issue=document.querySelector('#form-error');if(issue)issue.textContent='';
    if(editing&&el.id.startsWith('mat-')){pendingMaterial[el.id.slice(4)]=el.value;dirty=true;}
    if(editing&&el.name){editing[el.name]=['qty','target','price'].includes(el.name)?M.parseNumber(el.value):el.value;dirty=true;}
  });
  document.addEventListener('change',ev=>{if(ev.target.id==='role'){role=ev.target.value;render();}if(ev.target.id==='mat-kind'&&ev.target.value==='Материалы заказчика'){document.querySelector('#mat-payer').value='customer';pendingMaterial.payer='customer';}});
  let lastHash=location.hash;
  window.addEventListener('hashchange',()=>{if(dirty){const next=location.hash;history.replaceState(null,'',location.pathname+location.search+lastHash);askLeave(()=>{location.hash=next;});return;}lastHash=location.hash;render();scrollTo(0,0);});
  window.addEventListener('beforeunload',ev=>{if(dirty){ev.preventDefault();ev.returnValue='';}});
  render();
})();
</script></body></html>
